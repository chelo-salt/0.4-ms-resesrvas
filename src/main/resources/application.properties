# Configuración del Servidor (Siguiente puerto disponible)
server.port=8083
spring.application.name=reservas

# Configuración de la Base de Datos en Docker
spring.datasource.url=jdbc:mysql://localhost:3307/db_reservas?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desactivar advertencia de Open Session in View
spring.jpa.open-in-view=false

api.canchas.base-url=http://localhost:8081
server.error.include-message=always