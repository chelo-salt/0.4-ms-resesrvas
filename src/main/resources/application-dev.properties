spring.application.name=ms-reservas
server.port=8084

# 🗄️ CONFIGURACIÓN DE BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3314/bd_reservas?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ☕ CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 🔗 COMUNICACIONES INTERNAS Y SEGURIDAD
api.canchas.base-url=http://localhost:8083
jwt.secret=ClaveUltraSecretaEInviolableParaLaMunicipalidad2026!

# 🌐 REDIRECCIÓN AL API GATEWAY (RESPALDO DE PERFIL)
springdoc.openapi.servers[0].url=http://localhost:8080
springdoc.openapi.servers[0].description=API Gateway (Entorno Local)